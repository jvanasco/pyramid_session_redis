[tox]
envlist =
	lint,
	mypy,
	docs,
	py37,py38,py39,py310,py311,py312,py313

[testenv]
extras =
    testing
commands =
    python --version
    pytest {posargs:}
passenv =
    PSR_TEST_REDIS_URL

[testenv:mypy]
commands =
    mypy src/pyramid_session_redis tests

[testenv:lint]
deps =
    flake8
    flake8-import-order
commands =
    flake8

[testenv:docs]
extras =
    docs
commands =
    python -m sphinx -W --keep-going -b html docs {envtmpdir}/docs
