[metadata]
name = pyramid_session_redis
version = attr: pyramid_session_redis.__VERSION__
description = High performance and actively maintained server-side session framework for Pyramid and Redis.
long_description = file: README.md
long_description_content_type = text/markdown
author = Jonathan Vanasco
author_email = jonathan@findmeon.com
url = https://github.com/jvanasco/pyramid_session_redis
license = BSD
license_files = LICENSE.txt
keywords = pyramid session redis
classifiers =
    Intended Audience :: Developers
    Framework :: Pyramid
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
package_dir =
    = src
packages = find:
zip_safe = false
include_package_data = false
install_requires =
    redis>=4.0.0
    pyramid>=2
    zope.interface
    typing_extensions>=4.1

[options.packages.find]
where = src

[options.package_data]
pyramid_session_redis = py.typed

[options.extras_require]
testing =
    coverage
    mypy
    nose
    pytest
    # Pyramid <2.1 needs pkg_resources but does not cap setuptools itself.
    # Keep this test-only; Pyramid >=2.1 declares its own compatible dependency.
    setuptools<82
    types-setuptools
    types-webob
    types-waitress
    webob
    webtest
    waitress
docs =
    sphinx

[tox:tox]
envlist =
    lint
    mypy
    docs
    py37,py38,py39,py310,py311,py312,py313

[testenv]
extras = testing
commands =
    python --version
    pytest {posargs:}
passenv = PSR_TEST_REDIS_URL

[testenv:mypy]
commands = mypy

[testenv:lint]
deps =
    flake8
    flake8-import-order
commands = flake8

[testenv:docs]
extras = docs
commands = python -m sphinx -W --keep-going -b html docs {envtmpdir}/docs

[flake8]
extend-exclude =
    docs/_build
    build
    dist

application_import_names = pyramid_session_redis
import_order_style = appnexus

# E501: line too long
# E731: don't use lambda
per-file-ignores =
	src/pyramid_session_redis/__init__.py: E501
	src/pyramid_session_redis/compat.py: F401,E501
	src/pyramid_session_redis/session.py: E501
	src/pyramid_session_redis/util.py: E501
	tests/__init__.py: E501
	tests/_util.py: E501
	tests/test_factory.py: E501,E731
    tests/test_pyramid.py: E501
	tests/test_serializers.py: E501
	tests/test_session.py: E501,E731
	tests/test_support.py: E501
	tests/test_backend.py: E501
	tests/test_regressions.py: E501
	tests/test_util.py: E731
	tests/web_app.py: E501
