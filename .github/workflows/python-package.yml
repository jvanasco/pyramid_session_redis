# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python Current

on:
  push:
    branches: 
      - main
      - "branch-*"
      # branches used to test the workflow
      - "workflow_test_*"
  pull_request:
    branches:
      - main
      - "branch-*"

jobs:
  build:
    name: core-tests--py-${{ matrix.python-version }}--${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - "ubuntu-22.04"
        python-version: 
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        backend:
          - "redis:7.2"
          - "valkey/valkey:7.2"
          - "valkey/valkey:8"

    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      backend:
        # Docker Hub image
        image: ${{ matrix.backend }}
        # Set health checks to wait until redis has started
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps port 6379 on service container to the host
          - 6379/tcp
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade tox setuptools flake8 pytest mypy
        pip install ".[testing]"
        pip freeze
    - name: Test with tox/pytest
      # tox is used to run pytest
      env:
        PSR_TEST_REDIS_URL: redis://localhost:${{ job.services.backend.ports['6379'] }}/9
      run: |
        tox -e py

  typing:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - run: python -m pip install tox
    - run: tox -e mypy

  documentation:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: "3.13"
    - run: python -m pip install '.[docs]' build
    - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
    - name: Check distribution contents
      run: |
        python -m build
        python - <<'PY'
        from pathlib import Path
        import tarfile
        import zipfile

        wheel, = Path("dist").glob("*.whl")
        source, = Path("dist").glob("*.tar.gz")
        with zipfile.ZipFile(wheel) as archive:
            names = archive.namelist()
            assert "pyramid_session_redis/py.typed" in names
            assert not any("docs" in name.split("/") for name in names)
        with tarfile.open(source) as archive:
            names = archive.getnames()
            assert any(name.endswith("/src/pyramid_session_redis/py.typed") for name in names)
            assert not any("docs" in name.split("/") for name in names)
        PY
